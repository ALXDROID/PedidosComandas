<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="img/pleto.png" type="png"/>a
    <title>ale</title>

</head>
<body onclick="unlockAudio()" onkeydown="unlockAudio()">



    
<script>


       let orders = [];
        let phantomOrder = null;
        let deletedOrders = [];
        let selectedOrderIndex = 0;
        let lastOrderId = 0; // Track the last order ID
let audioUnlocked = false;

function unlockAudio() {
    if (!audioUnlocked) {
        const beep = new Audio('alert1.mp3');
        beep.volume = 0; // volumen 0 para no molestar
        beep.play().then(() => {
            audioUnlocked = true;
            console.log("Audio desbloqueado.");
        }).catch((e) => {
            console.warn("No se pudo desbloquear el audio:", e);
        });
    }
}

 function updateOrderCount() {
    const orderCountElement = document.getElementById('ordenum');
    if (orderCountElement) {
        orderCountElement.innerText = orders.length;
    }
}
           
        function addOrder(orderItem, orderClient, orderCount, orderId) {
            const order = {
                producto: orderItem, 
                cliente: orderClient,
                //cuenta: orderCount,
                timestamp: new Date(),
                cuenta: orderCount,
                id: orderId,
            };
            orders.push(order);
            renderOrders();
            startTimer(order.id);
           updateOrderCount();
        }

        function startTimer(orderId) {
            setInterval(() => {
                const orderElement = document.getElementById(orderId);
                if (orderElement) {
                    const order = orders.find(o => o.id === orderId);
                    const timeElapsed = (new Date() - new Date(order.timestamp)) / 1000;
                    orderElement.querySelector('.order-time').textContent = formatTime(timeElapsed);

                    if (timeElapsed > 600) {
                        orderElement.classList.add('red');
                        orderElement.classList.remove('yellow');
                    } else if (timeElapsed > 300) {
                        orderElement.classList.add('yellow');
                    }
                }
            }, 1000);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
     

    function renderOrders() {
    addOrderNumbering(); // Numerar pedidos antes de renderizar
    const orderList = document.getElementById('orderList');
    orderList.innerHTML = '';

    orders.forEach((order, index) => {
        const orderBox = document.createElement('div');
        orderBox.className = 'order-box';
        orderBox.id = order.id;
        orderBox.tabIndex = 0;
        orderBox.innerHTML = `
            <div class="order-header">${order.cliente}</div>
            <div class="order-count">${order.cuenta}</div>
            <div class="order-details">${order.producto}</div>
            <div class="order-progress">Pedido ${order.currentOrder} de ${order.totalOrders}</div>
            <div class="order-time">${formatTime(0)}</div>
        `;
        orderBox.addEventListener('keydown', (event) => handleKeydown(event, index));
        orderList.appendChild(orderBox);
    });

     phantomOrder = document.getElementById('phantom-order') || document.createElement('div');
    phantomOrder.className = 'order-box phantom-order';
    phantomOrder.id = 'phantom-order';
    phantomOrder.tabIndex = -1;
    phantomOrder.style.display = orders.length === 0 ? 'block' : 'none';
    phantomOrder.textContent = 'Sin órdenes';
    orderList.appendChild(phantomOrder);

   // if (orders.length === 0) {
   //     phantomOrder.focus();
   // } else {
    //    focusOrder(selectedOrderIndex);
   // }
   if (orders.length > 0) {
        selectedOrderIndex = 0; // Asegurar que el índice seleccionado sea el primero
        focusOrder(selectedOrderIndex); // Enfocar el primer pedido
    } else {
        phantomOrder.focus();
    }
}



        function handleKeydown(event, index) {
            if (event.key === 'Delete') {
                deleteOrder(index);


            } else if (event.key === 'ArrowDown') {
                selectedOrderIndex = (index + 1) % orders.length;
                focusOrder(selectedOrderIndex);
            } else if (event.key === 'ArrowUp') {
                selectedOrderIndex = (index - 1 + orders.length) % orders.length;
                focusOrder(selectedOrderIndex);
            } else if (event.key === ' ') {
              if (phantomOrder && document.activeElement.id === 'phantom-order') {
               
            document.getElementById('restoreOrderButton').click(); // ejecuta undoDelete()
        } else {
            undoDelete();
        }
        }
}

function deleteOrder(index) {
    const order = orders.splice(index, 1)[0];
    deletedOrders.push(order);
    $.ajax({
        url: 'deleteOrder.php',
        type: 'POST',
        data: { id: order.id },
        success: function(response) {
            console.log('Order moved to deleted_orders:', response);
            renderOrders();
            if (orders.length < 0) {
    document.getElementById('phantom-order').focus();
} else {
    // Si el índice eliminado era el último, enfoca al primero
    selectedOrderIndex = index >= orders.length ? 0 : index;
    focusOrder(selectedOrderIndex);
}
            updateOrderCount();
        },
        error: function(xhr, status, error) {
            console.error('Error:', error);
        }
    });
}

     

     function undoDelete() {
    if (deletedOrders.length > 0) {
        const lastDeletedOrder = deletedOrders.pop();
        orders.unshift(lastDeletedOrder);
        $.ajax({
            url: 'restoreOrder.php',
            type: 'POST',
            data: { id: lastDeletedOrder.id },
            success: function(response) {
                console.log('Order restored:', response);
                renderOrders();
                selectedOrderIndex = 0;
                focusOrder(selectedOrderIndex);
            },
            error: function(xhr, status, error) {
                console.error('Error:', error);
            }
        });
        updateOrderCount();
    }
}


        function focusOrder(index) {
            if (orders.length >= 0) {

                const orderElement = document.getElementById(orders[index].id);
                if (orderElement) {
                    
                    orderElement.focus();
                }else {
                document.getElementById('phantom-order').focus();
            }
            }
        }

        function loadOrders() {
            $.ajax({
                url: 'getOrders.php',
                type: 'GET',
                data: { lastId: lastOrderId },
                dataType: 'json',
                success: function(data) {
                    if (Array.isArray(data)) {
                         let newOrderAdded = false;
                        data.forEach(order => {
            if (!orders.find(o => o.id === order.IDAuto)) {
                addOrder(order.nomProd, order.nomCliente, order.cantidad, order.IDAuto);
                lastOrderId = Math.max(lastOrderId, order.IDAuto); // Update the lastOrderId
                newOrderAdded = true;
            }
        });

        if (newOrderAdded) {
            playBeep(); // 🔊 beep cuando haya una nueva orden
        }
                        updateOrderCount();
                    }
                },
                error: function(xhr, status, error) {
                    console.error('Error:', error);
                }
            });
        }

        function pollForNewOrders() {
           setInterval(loadOrders, 2000); // Poll every 2 seconds
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            pollForNewOrders();
        });

        document.addEventListener('DOMContentLoaded', (event) => {
            function updateDateTime() {
                const now = new Date();
                const dateTimeString = now.toLocaleString('es-ES', { dateStyle: 'full', timeStyle: 'medium' });
                document.getElementById('datetime').innerText = dateTimeString;
            }

            updateDateTime();
           setInterval(updateDateTime, 1000); // Actualiza cada segundo
           document.getElementById('restoreOrderButton').addEventListener('click', () => {
            undoDelete();
    });
        });
       function addOrderNumbering() {
    const ordersByClient = {};

    // Agrupar pedidos por cliente
    orders.forEach(order => {
        if (!ordersByClient[order.cliente]) {
            ordersByClient[order.cliente] = [];
        }
        ordersByClient[order.cliente].push(order);
    });

    // Numerar pedidos dentro de cada grupo
    for (const cliente in ordersByClient) {
        const clientOrders = ordersByClient[cliente];
        clientOrders.forEach((order, index) => {
            order.currentOrder = index + 1; // Índice actual (1 basado)
            order.totalOrders = clientOrders.length; // Total de pedidos
        });
    }
}
function playBeep() {
    const beep = new Audio('alert1.mp3'); // ruta a tu beep
    beep.volume = 1; // volumen entre 0 y 1
    beep.play().catch((e) => {
        console.warn('No se pudo reproducir el beep:', e);
    });
}
function addTouchEvents(orderBox, index) {
    let startX = 0;
    let hasSwiped = false; // Evitar múltiples eliminaciones


    orderBox.addEventListener('touchstart', (event) => {
        startX = event.touches[0].clientX;
        hasSwiped = false; // Reiniciar en cada toque
    });

    orderBox.addEventListener('touchmove', (event) => {
        const touch = event.touches[0];
        const diffX = touch.clientX - startX;

        // Detectar deslizamiento hacia la izquierda
        if (diffX < -50 && !hasSwiped) {
            hasSwiped = true; // Evitar múltiples eliminaciones
            orderBox.classList.add('swipe-left');
            setTimeout(() => deleteOrder(index), 300);
        }
    });

    orderBox.addEventListener('touchend', () => {
        // Restaurar posición de la caja si no se eliminó
        orderBox.style.transform = '';
    });

    orderBox.addEventListener('click', () => {
        selectedOrderIndex = index;
        focusOrder(selectedOrderIndex);
    });
}  
 

</script>
    <div class="pantalla">
    <div class="header">
        <div class="logo"><img src="img/pleto.png" alt="logo"></div>
        
    <nav>
        <a href="#" >Pantalla Pedidos</a>
        
    </nav>
    <button id="restoreOrderButton">Restaurar Último Pedido</button>
    <p id="ordenum">0</p>
    <p id="datetime"></p>
</div>
    <div class="container" id="container">
        <div id="orderList" class="order-list">
    </div>
    </div>
    </div>

        });

     <script>
    document.addEventListener('keydown', (event) => {
        if (event.key === ' ' || event.code === 'Space') {
            const phantomOrder = document.getElementById('phantom-order');
            if (phantomOrder && document.activeElement === phantomOrder) {
                event.preventDefault(); // Evita el scroll
                const restoreBtn = document.getElementById('restoreOrderButton');
                if (restoreBtn) restoreBtn.click(); // Simula click
            }
        }
    });
</script>
